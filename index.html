
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101426">
<title>PAHLAWAN MELAYU 2D</title>
<style>
*{box-sizing:border-box;touch-action:none}
body{margin:0;background:#090d19;color:white;font-family:Arial;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#menu{position:absolute;inset:0;background:linear-gradient(135deg,#101629,#34304b);display:flex;align-items:center;justify-content:center;overflow:auto;padding:12px}
.panel{width:min(470px,100%);background:#182238;border:2px solid #d9ad54;border-radius:20px;padding:18px;text-align:center}
h1{color:#ffda77;font-size:clamp(26px,7vw,42px);margin:5px}
.sub{color:#b9c9df;font-size:12px;margin-bottom:12px}
select,button{padding:12px;border-radius:10px;border:1px solid #7383a1;background:#293a55;color:white;font-weight:bold}
select{width:100%;margin:4px 0}
.main{width:100%;margin:5px 0;background:linear-gradient(90deg,#a43b2b,#e1a23d);border:0;font-size:16px}
#hud{position:absolute;top:8px;left:3%;width:94%;display:none;align-items:center;gap:8px}
.player{width:43%;text-align:center}
.name{font-size:12px;font-weight:bold}
.hp{height:15px;background:#333;border:2px solid white;border-radius:10px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#16bd66,#d7e84a);width:100%}
#clock{font-size:23px;font-weight:bold;color:#ffe18a}
#round{position:absolute;top:45px;width:100%;text-align:center;font-size:12px;color:#ffe4a0}
#msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:clamp(26px,7vw,48px);font-weight:1000;color:#ffe16b;text-shadow:3px 4px #9d291f;text-align:center;pointer-events:none;white-space:nowrap}
#controls{position:absolute;bottom:10px;left:0;width:100%;display:none;justify-content:space-between;padding:5px;pointer-events:none}
.group{display:flex;gap:5px;align-items:end;pointer-events:auto}
.pad,.actions{display:grid;grid-template-columns:repeat(2,48px);gap:5px}
.ctrl{width:48px;height:46px;padding:2px;font-size:10px;background:#263b59e8;border:2px solid #9bb8df;border-radius:12px}
.hit{background:#a73535e8}.guard{background:#267b68e8}
#pause{position:absolute;right:8px;top:8px;display:none}
#hint{font-size:11px;line-height:1.6;color:#b9c9df;margin-top:10px}
@media(orientation:portrait){
 .ctrl{width:42px;height:42px;font-size:9px}
 .pad,.actions{grid-template-columns:repeat(2,42px)}
}
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>

<div id="menu">
<div class="panel">
<h1>PAHLAWAN MELAYU</h1>
<div class="sub">SENI SILAT • ARENA PERTARUNGAN 2D</div>
<div style="font-size:48px">🥋 ⚔️ 🥋</div>
<p style="color:#ffda77;font-weight:bold">PILIH PETARUNG</p>
<select id="c1">
<option value="0">JUBAL – Pendekar Merah</option>
<option value="1">PION – Pendekar Biru</option>
<option value="2">HITAM – Pendekar Hitam</option>
<option value="3">TEGAP – Pendekar Emas</option>
<option value="4">TOPAR – Pendekar Ungu</option>
</select>
<select id="c2">
<option value="1">PION – Pendekar Biru</option>
<option value="0">JUBAL – Pendekar Merah</option>
<option value="2">HITAM – Pendekar Hitam</option>
<option value="3">TEGAP – Pendekar Emas</option>
<option value="4">TOPAR – Pendekar Ungu</option>
</select>
<button class="main" onclick="start('AI')">LAWAN KOMPUTER</button>
<button class="main" onclick="start('2P')">DUA PEMAIN</button>
<div id="hint">
PEMAIN 1: A/D gerak, W lompat, S tunduk<br>
J tumbuk, K tendang, L bertahan, U combo<br>
PEMAIN 2: Anak panah, 1 tumbuk, 2 tendang,<br>
3 combo, 0 bertahan<br>
Telefon: gunakan butang kawalan di bawah.
</div>
</div>
</div>

<div id="hud">
<div class="player"><div class="name" id="n1"></div><div class="hp"><div class="fill" id="h1"></div></div></div>
<div id="clock">60</div>
<div class="player"><div class="name" id="n2"></div><div class="hp"><div class="fill" id="h2"></div></div></div>
</div>
<div id="round">PUSINGAN 1 / 3</div>
<div id="msg"></div>
<button id="pause" onclick="paused=!paused;msg.textContent=paused?'JEDA':''">JEDA</button>

<div id="controls">
<div class="group">
<div class="pad">
<button class="ctrl" data-p="0" data-a="left">◀</button>
<button class="ctrl" data-p="0" data-a="right">▶</button>
<button class="ctrl" data-p="0" data-a="down">TUNDUK</button>
<button class="ctrl" data-p="0" data-a="jump">LOMPAT</button>
</div>
<div class="actions">
<button class="ctrl hit" data-p="0" data-a="punch">TUMBUK</button>
<button class="ctrl hit" data-p="0" data-a="kick">TENDANG</button>
<button class="ctrl guard" data-p="0" data-a="block">TAHAN</button>
<button class="ctrl" data-p="0" data-a="special">COMBO</button>
</div>
</div>
<div class="group" id="right">
<div class="actions">
<button class="ctrl hit" data-p="1" data-a="punch">TUMBUK</button>
<button class="ctrl hit" data-p="1" data-a="kick">TENDANG</button>
<button class="ctrl guard" data-p="1" data-a="block">TAHAN</button>
<button class="ctrl" data-p="1" data-a="special">COMBO</button>
</div>
<div class="pad">
<button class="ctrl" data-p="1" data-a="left">◀</button>
<button class="ctrl" data-p="1" data-a="right">▶</button>
<button class="ctrl" data-p="1" data-a="down">TUNDUK</button>
<button class="ctrl" data-p="1" data-a="jump">LOMPAT</button>
</div>
</div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=960,H=540;

const heroes=[
 {name:'JUBAL',color:'#bd302c',light:'#ff9b62',dark:'#651c24'},
 {name:'PION',color:'#2675bf',light:'#8ce3ff',dark:'#17365e'},
 {name:'HITAM',color:'#292c35',light:'#a8aab5',dark:'#080b13'},
 {name:'TEGAP',color:'#d39a24',light:'#ffe89a',dark:'#744413'},
 {name:'TOPAR',color:'#7541a9',light:'#d9a1ff',dark:'#30164c'}
];

let fighters=[],mode='AI',running=false,paused=false;
let scores=[0,0],round=1,time=60,delay=0,last=0;
let keys={},touch=[{},{}],particles=[];

class Fighter{
 constructor(id,type,x){
  this.id=id;this.type=type;this.x=x;
  this.y=0;this.vy=0;this.face=id===0?1:-1;
  this.health=100;this.state='idle';
  this.attack='';this.at=0;this.cool=0;
  this.stun=0;this.block=false;this.hit=false;
  this.anim=0;
 }
 act(a){
  if(!running||paused||delay>0)return;
  if(a==='jump'){
   if(this.y===0){this.vy=-11;this.state='jump'}
   return;
  }
  if(a==='block'){this.block=true;return}
  if(['punch','kick','special'].includes(a)&&this.cool<=0&&this.stun<=0){
   this.attack=a;
   this.at=a==='special'?32:a==='kick'?25:18;
   this.cool=a==='special'?65:a==='kick'?38:27;
   this.hit=false;this.block=false;
  }
 }
 update(dt,enemy){
  let s=dt/16.67;
  this.anim+=s;
  this.cool=Math.max(0,this.cool-s);
  this.stun=Math.max(0,this.stun-s);
  if(this.y<0){
   this.y+=this.vy*s;
   this.vy+=.48*s;
   if(this.y>=0){this.y=0;this.vy=0}
  }
  if(this.at>0){
   this.at-=s;
   let active=this.at<(this.attack==='special'?21:this.attack==='kick'?16:11);
   if(active&&!this.hit){
    let reach=this.attack==='special'?135:this.attack==='kick'?105:82;
    let dx=(enemy.x-this.x)*this.face;
    if(dx>0&&dx<reach&&Math.abs(this.y-enemy.y)<90){
     enemy.damage(this.attack,this);
     this.hit=true;
    }
   }
  }
  if(this.stun>0)this.state='hurt';
  else if(this.at>0)this.state=this.attack;
  else if(this.y<0)this.state='jump';
  else if(this.block)this.state='block';
  else this.state='idle';
 }
 damage(type,attacker){
  if(this.block){
   sparks(this.x,340,'#9eeaff',5);
   return;
  }
  let d=type==='special'?19:type==='kick'?13:9;
  this.health=Math.max(0,this.health-d);
  this.stun=14;
  this.x+=attacker.face*(type==='special'?40:23);
  sparks(this.x,330,type==='special'?'#ffe16b':'#ff8a54',12);
 }
}

function sparks(x,y,color,n){
 for(let i=0;i<n;i++)
 particles.push({x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*8,life:24,color});
}

function start(m){
 mode=m;round=1;scores=[0,0];time=60;particles=[];
 fighters=[
  new Fighter(0,+c1.value,270),
  new Fighter(1,+c2.value,690)
 ];
 running=true;paused=false;delay=65;
 menu.style.display='none';hud.style.display='flex';
 controls.style.display='flex';pause.style.display='block';
 right.style.display=m==='2P'?'flex':'none';
 msg.textContent='SEDIA!';
 roundText();
 updateHud();
}

function roundText(){
 document.getElementById('round').textContent='PUSINGAN '+round+' / 3';
}
function updateHud(){
 fighters.forEach((f,i)=>{
  document.getElementById('h'+(i+1)).style.width=f.health+'%';
  document.getElementById('n'+(i+1)).textContent=heroes[f.type].name;
 });
 clock.textContent=Math.ceil(time);
}

function finish(){
 if(delay>0||!running)return;
 let a=fighters[0],b=fighters[1];
 let win=a.health===b.health?-1:a.health>b.health?0:1;
 if(win>=0)scores[win]++;
 msg.textContent=win<0?'SERI!':heroes[fighters[win].type].name+' MENANG!';
 delay=150;
 if(scores[0]>=2||scores[1]>=2||round===3){
  delay=220;
  setTimeout(()=>{
   if(!running)return;
   msg.textContent=scores[0]===scores[1]?'PERLAWANAN SERI!':
    scores[0]>scores[1]?'JUARA: '+heroes[fighters[0].type].name:
    'JUARA: '+heroes[fighters[1].type].name;
   setTimeout(showMenu,2500);
  },1500);
 }else{
  round++;
  setTimeout(()=>{
   if(!running)return;
   fighters.forEach((f,i)=>{
    f.health=100;f.x=i===0?270:690;f.y=0;f.vy=0;
    f.stun=0;f.at=0;f.cool=0;
   });
   time=60;roundText();updateHud();msg.textContent='MULA!';
  },1500);
 }
}

function showMenu(){
 running=false;paused=false;
 menu.style.display='flex';hud.style.display='none';
 controls.style.display='none';pause.style.display='none';
 msg.textContent='';
}

function move(f,id,dt){
 if(f.stun>0)return;
 let t=touch[id],left=!!t.left,rightKey=!!t.right;
 let down=!!t.down;
 if(id===0){
  left|=!!keys.a;rightKey|=!!keys.d;down|=!!keys.s;
  if(keys.w){f.act('jump');keys.w=false}
  if(keys.j){f.act('punch');keys.j=false}
  if(keys.k){f.act('kick');keys.k=false}
  if(keys.u){f.act('special');keys.u=false}
  f.block=!!keys.l||!!t.block;
 }else{
  left|=!!keys.ArrowLeft;rightKey|=!!keys.ArrowRight;
  down|=!!keys.ArrowDown;
  if(keys.ArrowUp){f.act('jump');keys.ArrowUp=false}
  if(keys['1']){f.act('punch');keys['1']=false}
  if(keys['2']){f.act('kick');keys['2']=false}
  if(keys['3']){f.act('special');keys['3']=false}
  f.block=!!keys['0']||!!t.block;
 }
 if(t.jump)f.act('jump');
 if(t.punch)f.act('punch');
 if(t.kick)f.act('kick');
 if(t.special)f.act('special');
 let speed=(down?1.2:3.2)*dt/16.67;
 if(left)f.x-=speed;
 if(rightKey)f.x+=speed;
 if(down&&f.y===0&&f.at<=0)f.state='crouch';
}

function ai(f,e){
 let d=e.x-f.x;
 f.face=d>0?1:-1;
 if(Math.abs(d)>100)f.x+=Math.sign(d)*1.8;
 else if(f.cool<=0&&Math.random()<.055)
 f.act(Math.random()<.5?'punch':Math.random()<.8?'kick':'special');
 if(Math.random()<.012&&f.y===0)f.act('jump');
 if(Math.random()<.025)f.block=true;
 else if(f.cool>0)f.block=false;
}

function update(dt){
 if(!running||paused)return;
 if(delay>0){delay-=dt/16.67;return}
 let [a,b]=fighters;
 a.face=a.x<b.x?1:-1;b.face=-a.face;
 move(a,0,dt);
 if(mode==='2P')move(b,1,dt);else ai(b,a);
 a.update(dt,b);b.update(dt,a);
 a.x=Math.max(80,Math.min(880,a.x));
 b.x=Math.max(80,Math.min(880,b.x));
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life--});
 particles=particles.filter(p=>p.life>0);
 time-=dt/1000;
 updateHud();
 if(a.health<=0||b.health<=0||time<=0)finish();
}

// LANTAI DAN ARENA
function background(){
 let g=ctx.createLinearGradient(0,0,0,540);
 g.addColorStop(0,'#17213c');g.addColorStop(.6,'#704b54');g.addColorStop(1,'#1c2630');
 ctx.fillStyle=g;ctx.fillRect(0,0,960,540);

 // Bulan
 ctx.fillStyle='#ffe8a5';
 ctx.beginPath();ctx.arc(760,95,39,0,7);ctx.fill();

 // Gunung
 ctx.fillStyle='#28334a';
 for(let i=0;i<5;i++){
  ctx.beginPath();ctx.moveTo(i*240-80,330);
  ctx.lineTo(i*240+65,145+(i%2)*50);
  ctx.lineTo(i*240+230,330);ctx.fill();
 }

 // Rumah kampung
 for(let i=0;i<5;i++){
  let x=i*220+20;
  ctx.fillStyle='#352b35';ctx.fillRect(x,230,110,90);
  ctx.fillStyle='#9a5839';
  ctx.beginPath();ctx.moveTo(x-12,235);ctx.lineTo(x+55,180);ctx.lineTo(x+122,235);ctx.fill();
  ctx.fillStyle='#ffda8b';ctx.fillRect(x+42,260,25,35);
 }

 // Lantai gelanggang
 let floor=ctx.createLinearGradient(0,315,0,540);
 floor.addColorStop(0,'#75614e');floor.addColorStop(1,'#252b35');
 ctx.fillStyle=floor;ctx.fillRect(0,315,960,225);
 ctx.strokeStyle='#d6bd8b55';ctx.lineWidth=2;
 for(let i=0;i<8;i++){
  ctx.beginPath();ctx.moveTo(0,320+i*i*3.2);
  ctx.lineTo(960,320+i*i*3.2);ctx.stroke();
 }
 ctx.strokeStyle='#f3d49b99';ctx.lineWidth=4;
 ctx.beginPath();ctx.ellipse(480,415,270,75,0,0,7);ctx.stroke();

 // Tiang lampu
 for(let x of [70,890]){
  ctx.fillStyle='#252735';ctx.fillRect(x,90,7,240);
  ctx.fillStyle='#ffdf93';ctx.beginPath();ctx.arc(x+3,85,13,0,7);ctx.fill();
 }
}

// WATAK SILAT MELAYU
function fighterDraw(f){
 let c=heroes[f.type];
 let floor=370;
 let y=floor+f.y;
 let dir=f.face;
 let t=f.anim;
 let crouch=f.state==='crouch'?17:0;
 let moving=f.state==='idle'?Math.sin(t*.12)*2:Math.sin(t*.3)*5;
 let attack=f.at>0;
 let kick=attack&&f.attack==='kick';
 let special=attack&&f.attack==='special';

 ctx.save();
 ctx.translate(f.x,y);
 ctx.scale(dir,1);

 // Bayang
 ctx.fillStyle='#0008';ctx.beginPath();
 ctx.ellipse(0,7,45,11,0,0,7);ctx.fill();

 // Kesan aura combo
 if(special){
  ctx.globalAlpha=.3;
  ctx.fillStyle=c.light;ctx.beginPath();
  ctx.arc(0,-80,70+Math.sin(t)*10,0,7);ctx.fill();
  ctx.globalAlpha=1;
 }

 function line(x1,y1,x2,y2,w,color){
  ctx.strokeStyle=color;ctx.lineWidth=w;
  ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 }
 function rect(x,y,w,h,color){
  ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
 }

 // Kaki belakang dan hadapan
 line(-10,-40+crouch,-23+moving,2,19,c.dark);
 line(10,-40+crouch,kick?78:22, kick?-30:3,20,c.color);
 line(-23+moving,2,-34+moving,5,18,c.color);
 line(kick?78:22,kick?-30:3,kick?100:34,5,18,c.dark);

 // Tapak kaki
 rect(-45+moving,-2,30,12,'#181c26');
 rect(kick?88:22,-2,31,12,'#181c26');

 // Badan baju silat
 let body=ctx.createLinearGradient(-25,-120,30,-35);
 body.addColorStop(0,c.light);body.addColorStop(.5,c.color);body.addColorStop(1,c.dark);
 ctx.fillStyle=body;
 ctx.beginPath();
 ctx.moveTo(-22,-112+crouch);
 ctx.lineTo(22,-112+crouch);
 ctx.lineTo(25,-43+crouch);
 ctx.lineTo(-25,-43+crouch);ctx.closePath();ctx.fill();

 // Leher
 rect(-8,-125+crouch,16,20,'#b97951');

 // Kolar baju Melayu
 ctx.fillStyle=c.light;
 ctx.beginPath();
 ctx.moveTo(-10,-111+crouch);ctx.lineTo(0,-91+crouch);
 ctx.lineTo(10,-111+crouch);ctx.lineTo(0,-105+crouch);ctx.fill();

 // Bengkung
 rect(-25,-52+crouch,50,9,'#d9bd75');
 rect(-4,-55+crouch,9,15,'#f6d88a');

 // Samping corak
 ctx.fillStyle=c.dark;
 ctx.beginPath();ctx.moveTo(-22,-44+crouch);
 ctx.lineTo(22,-44+crouch);ctx.lineTo(27,-12);
 ctx.lineTo(-18,-12);ctx.fill();
 ctx.strokeStyle=c.light;ctx.lineWidth=2;
 for(let i=0;i<4;i++){
  ctx.beginPath();ctx.moveTo(-15+i*10,-42+crouch);
  ctx.lineTo(-11+i*10,-15);ctx.stroke();
 }

 // Lengan kiri
 line(-20,-103+crouch,-34,-75+crouch,16,c.dark);
 line(-34,-75+crouch,-31,-58+crouch,14,c.color);

 // Lengan kanan / serangan
 let arm=attack?55:30;
 let ay=attack?-84:-73;
 line(20,-103+crouch,arm,ay+crouch,17,c.color);
 line(arm,ay+crouch,attack?arm+12:35,-61+crouch,14,c.dark);

 // Tangan
 ctx.fillStyle='#bb805a';
 ctx.beginPath();ctx.arc(attack?arm+12:35,-61+crouch,10,0,7);ctx.fill();
 ctx.fillStyle=c.light;ctx.beginPath();
 ctx.arc(attack?arm+12:35,-61+crouch,5,0,7);ctx.fill();

 // Kepala
 let skin=ctx.createRadialGradient(-7,-140,2,0,-128,25);
 skin.addColorStop(0,'#f0bd91');skin.addColorStop(1,'#9a5d43');
 ctx.fillStyle=skin;
 ctx.beginPath();ctx.ellipse(0,-130+crouch,21,25,0,0,7);ctx.fill();

 // Rambut
 ctx.fillStyle='#17151a';
 ctx.beginPath();ctx.arc(0,-143+crouch,21,Math.PI,7);ctx.fill();

 // Tanjak Melayu
 ctx.fillStyle=c.dark;
 ctx.beginPath();
 ctx.moveTo(-22,-146+crouch);
 ctx.lineTo(-8,-161+crouch);
 ctx.lineTo(1,-149+crouch);
 ctx.lineTo(13,-164+crouch);
 ctx.lineTo(23,-145+crouch);
 ctx.closePath();ctx.fill();
 ctx.fillStyle=c.light;
 ctx.fillRect(-21,-148+crouch,42,5);

 // Mata dan misai
 ctx.fillStyle='white';ctx.fillRect(6,-134+crouch,6,4);
 ctx.fillStyle='#151515';ctx.fillRect(9,-134+crouch,3,4);
 ctx.strokeStyle='#38221b';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(-5,-116+crouch);ctx.lineTo(5,-116+crouch);ctx.stroke();

 // Kesan terkena serangan
 if(f.state==='hurt'){
  ctx.strokeStyle='white';ctx.lineWidth=4;
  ctx.strokeRect(-35,-175,70,175);
 }

 ctx.restore();

 ctx.fillStyle='white';ctx.font='bold 14px Arial';
 ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=5;
 ctx.fillText(c.name,f.x,175+f.y);
 ctx.shadowBlur=0;
}

function draw(){
 ctx.clearRect(0,0,W,H);
 background();
 if(fighters.length){
  [...fighters].sort((a,b)=>a.x-b.x).forEach(fighterDraw);
  particles.forEach(p=>{
   ctx.globalAlpha=p.life/24;
   ctx.fillStyle=p.color;ctx.beginPath();
   ctx.arc(p.x,p.y,4,0,7);ctx.fill();
  });
  ctx.globalAlpha=1;
 }
}

function loop(now){
 let dt=Math.min(now-last||16,40);
 last=now;update(dt);draw();
 requestAnimationFrame(loop);
}

document.querySelectorAll('.ctrl').forEach(b=>{
 let p=+b.dataset.p,a=b.dataset.a;
 function on(e){
  e.preventDefault();touch[p][a]=true;
  if(['jump','punch','kick','special'].includes(a))
   fighters[p]?.act(a);
 }
 function off(e){e.preventDefault();touch[p][a]=false}
 b.addEventListener('pointerdown',on);
 b.addEventListener('pointerup',off);
 b.addEventListener('pointercancel',off);
 b.addEventListener('pointerleave',off);
});

window.addEventListener('keydown',e=>{
 keys[e.key]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
window.addEventListener('keyup',e=>keys[e.key]=false);

requestAnimationFrame(loop);
</script>
</body>
</html>
