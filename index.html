
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SUPER DURIAN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#102b35;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#ui{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:bold;text-shadow:1px 2px 3px #000}
#status{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#102b35eF;border:2px solid #8ee66b;padding:12px;border-radius:20px;text-align:center;font-size:13px;max-width:94%;white-space:normal}
#start{position:absolute;inset:0;background:#102b35ee;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
button{background:#ffc928;border:0;padding:15px 25px;border-radius:12px;font-size:18px;font-weight:bold;margin:5px}
.small{font-size:13px;line-height:1.8;color:#d9eddf}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
<span>🍈 SUPER DURIAN</span>
<span>⭐ <b id="score">0</b></span>
</div>

<div id="status">🎤 Mikrofon belum aktif</div>

<div id="start">
<h1>🍈 SUPER DURIAN</h1>
<h3>Pengembaraan Zikir</h3>
<p class="small">
SUBHANALLAH = MAJU<br>
MASYAALLAH = UNDUR<br>
ALLAH = LOMPAT<br>
ALLAH ALLAH = LOMPAT TINGGI<br>
ALHAMDULILLAH = TEMBAK<br>
ALLAHU AKBAR = BERHENTI
</p>
<button onclick="startGame()">▶ MULA PERMAINAN</button>
<p class="small">Benarkan akses mikrofon apabila diminta.<br>Gunakan Chrome melalui laman HTTPS.</p>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let running=false;
let player={x:100,y:0,w:38,h:48,vx:0,vy:0,ground:false};
let camera=0,score=0;
let platforms=[],enemies=[],bullets=[];
let moveDir=0,moveUntil=0,combo=0,lastMove=0;
let speech=null;
let restarting=false;

const status=document.getElementById("status");

function world(){
 platforms=[
 {x:0,y:H-65,w:850},
 {x:970,y:H-65,w:650},
 {x:1740,y:H-65,w:750},
 {x:260,y:H-185,w:160},
 {x:650,y:H-220,w:170},
 {x:1100,y:H-180,w:180},
 {x:1450,y:H-230,w:170},
 {x:1900,y:H-190,w:180}
 ];

 enemies=[
 {x:430,y:H-105,alive:true},
 {x:720,y:H-260,alive:true},
 {x:1180,y:H-225,alive:true},
 {x:1550,y:H-105,alive:true},
 {x:2020,y:H-235,alive:true}
 ];
}

function startGame(){
 if(running)return;

 const SR=window.SpeechRecognition||
 window.webkitSpeechRecognition;

 if(!SR){
  status.textContent="❌ Browser tidak menyokong Voice Recognition. Cuba Google Chrome.";
  return;
 }

 document.getElementById("start").style.display="none";

 player.x=100;
 player.y=H-150;
 player.vx=0;
 player.vy=0;

 score=0;
 camera=0;
 combo=0;
 moveDir=0;
 moveUntil=0;
 bullets=[];
 world();

 running=true;
 document.getElementById("score").textContent="0";

 startVoice();
 requestAnimationFrame(loop);
}

function startVoice(){
 const SR=window.SpeechRecognition||
 window.webkitSpeechRecognition;

 speech=new SR();
 speech.lang="ms-MY";
 speech.continuous=true;
 speech.interimResults=false;
 speech.maxAlternatives=3;

 speech.onstart=()=>{
  status.textContent="🎤 MIKROFON AKTIF — Sebut arahan zikir";
 };

 speech.onresult=e=>{
  for(let i=e.resultIndex;i<e.results.length;i++){
   if(e.results[i].isFinal){
    const result=e.results[i];
    let words=[];

    for(let j=0;j<result.length;j++){
     words.push(result[j].transcript);
    }

    processVoice(words.join(" "));
   }
  }
 };

 speech.onerror=e=>{
  status.textContent="🎤 Mikrofon: "+e.error;
  if(e.error==="not-allowed"||e.error==="service-not-allowed"){
   running=false;
  }
 };

 speech.onend=()=>{
  if(running&&!restarting){
   restarting=true;
   setTimeout(()=>{
    restarting=false;
    if(running){
     try{speech.start()}catch(e){}
    }
   },500);
  }
 };

 try{
  speech.start();
 }catch(e){
  status.textContent="❌ Gagal mengaktifkan mikrofon.";
 }
}

function processVoice(raw){
 if(!running)return;

 let t=raw.toLowerCase()
 .replace(/[.,!?]/g," ")
 .replace(/\s+/g," ").trim();

 // ALLAHU AKBAR = BERHENTI
 if(/\ballahu\s+akbar\b/.test(t)){
  moveDir=0;
  moveUntil=0;
  combo=0;
  player.vx=0;
  status.textContent="⛔ BERHENTI — ALLAHU AKBAR";
  return;
 }

 // ALHAMDULILLAH = TEMBAK
 let tembak=(t.match(/\balhamdulillah\b/g)||[]).length;

 if(tembak){
  for(let i=0;i<tembak;i++){
   bullets.push({
    x:player.x+player.w,
    y:player.y+20,
    vx:10
   });
  }
  status.textContent="💥 ALHAMDULILLAH — TEMBAK!";
 }

 // SUBHANALLAH = MAJU
 let maju=(t.match(/\bsubhan\s*allah\b|\bsubhanallah\b/g)||[]).length;

 if(maju){
  let now=Date.now();
  combo=(moveDir===1&&now-lastMove<1800)?combo+maju:maju;
  moveDir=1;
  moveUntil=now+maju*700;
  lastMove=now;
  status.textContent="➡️ MAJU ×"+maju;
 }

 // MASYAALLAH = UNDUR
 let undur=(t.match(/\b(?:masya|masha)\s*allah\b/g)||[]).length;

 if(undur){
  let now=Date.now();
  combo=(moveDir===-1&&now-lastMove<1800)?combo+undur:undur;
  moveDir=-1;
  moveUntil=now+undur*700;
  lastMove=now;
  status.textContent="⬅️ UNDUR ×"+undur;
 }

 // ALLAH ALLAH = LOMPAT TINGGI
 // Elakkan mengesan Allahu Akbar
 let allah=(t.match(/\ballah\b/g)||[]).length;

 if(allah>=2){
  player.vy=-19;
  player.ground=false;
  status.textContent="🚀 LOMPAT TINGGI!";
 }else if(allah===1){
  if(player.ground){
   player.vy=-12;
   player.ground=false;
  }
  status.textContent="⬆️ LOMPAT!";
 }
}

function hit(a,b){
 return a.x<b.x+b.w&&
 a.x+a.w>b.x&&
 a.y<b.y+b.h&&
 a.y+a.h>b.y;
}

function update(){
 if(Date.now()>moveUntil){
  moveDir=0;
  combo=0;
 }

 let speed=Math.min(10,3+combo*1.2);
 player.vx=moveDir*speed;
 player.x+=player.vx;

 player.vy+=0.65;
 player.y+=player.vy;
 player.ground=false;

 for(let p of platforms){
  if(player.x+player.w>p.x&&
  player.x<p.x+p.w&&
  player.y+player.h>=p.y&&
  player.y+player.h<=p.y+22&&
  player.vy>=0){
   player.y=p.y-player.h;
   player.vy=0;
   player.ground=true;
  }
 }

 for(let e of enemies){
  if(!e.alive)continue;

  if(hit(player,{x:e.x,y:e.y,w:43,h:43})){
   if(player.vy>1&&player.y+player.h<e.y+27){
    e.alive=false;
    player.vy=-9;
    score+=10;
   }else{
    player.x=Math.max(50,player.x-100);
    player.vy=-5;
   }
  }
 }

 for(let b of bullets){
  b.x+=b.vx;

  for(let e of enemies){
   if(e.alive&&hit(b,{x:e.x,y:e.y,w:43,h:43})){
    e.alive=false;
    b.x=99999;
    score+=10;
   }
  }
 }

 bullets=bullets.filter(b=>b.x<camera+W+100);

 if(player.y>H+100){
  player.x=Math.max(50,player.x-150);
  player.y=H-150;
  player.vy=0;
 }

 camera=Math.max(0,player.x-W*.35);
 document.getElementById("score").textContent=score;
}

function draw(){
 ctx.fillStyle="#79d3f2";
 ctx.fillRect(0,0,W,H);

 // Awan
 ctx.fillStyle="white";
 for(let i=0;i<10;i++){
  let x=((i*260-camera*.25)%(W+260)+W+260)%(W+260);
  let y=65+(i%3)*55;
  ctx.beginPath();
  ctx.arc(x,y,23,0,7);
  ctx.arc(x+28,y,28,0,7);
  ctx.arc(x+55,y,20,0,7);
  ctx.fill();
 }

 // Bukit
 ctx.fillStyle="#48a56c";
 for(let i=0;i<9;i++){
  let x=i*300-camera*.5;
  ctx.beginPath();
  ctx.arc(x,H-40,160,Math.PI,0);
  ctx.fill();
 }

 // Platform
 for(let p of platforms){
  let x=p.x-camera;
  ctx.fillStyle="#9b5c2c";
  ctx.fillRect(x,p.y,p.w,H-p.y);
  ctx.fillStyle="#46b84e";
  ctx.fillRect(x,p.y,p.w,12);
 }

 // Musuh durian
 for(let e of enemies){
  if(!e.alive)continue;
  let x=e.x-camera;
  ctx.font="42px Arial";
  ctx.fillText("🌰",x,e.y+40);
  ctx.font="12px Arial";
  ctx.fillStyle="#173c20";
  ctx.fillText("DURIAN",x,e.y+52);
 }

 // Tembakan
 ctx.fillStyle="#ffdf35";
 for(let b of bullets){
  ctx.beginPath();
  ctx.arc(b.x-camera,b.y,7,0,Math.PI*2);
  ctx.fill();
 }

 // Watak
 ctx.font="43px Arial";
 ctx.fillText("🧑",player.x-camera,player.y+43);

 ctx.fillStyle="#fff";
 ctx.font="12px Arial";
 ctx.fillText("DUNIA SUPER DURIAN",20,H-15);
}

function loop(){
 if(!running)return;
 update();
 draw();
 requestAnimationFrame(loop);
}

document.addEventListener("visibilitychange",()=>{
 if(document.hidden&&speech){
  try{speech.stop()}catch(e){}
 }
});
</script>
</body>
</html>
